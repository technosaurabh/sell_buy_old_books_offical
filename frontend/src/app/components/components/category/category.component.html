<!-- book-card.component.html -->

<div class=" mt-3" style=" ">

    <div>
        <div class="mt-2 d-flex justify-content-between">
            <div>
                <h4 class="m-0 p-0">Category</h4>
            </div>
            <div>
            <button [routerLink]="['/management/category/add']" class="btn btn-warning "><span class="fs-6">Add New Category</span></button>
            </div>
          </div>
    </div>
   
    <div class="mt-3" >

        <nz-table #basicTable [nzData]="categoryData">
            <thead>
              <tr>
                <th>Name</th>
                <th>Description</th>
              </tr>
            </thead>
            <tbody>
              @for (data of basicTable.data; track data) {
                <tr>
                  <td>{{ data.categoryName }}</td>
                  <td>{{ data.categoryDescription }}</td>
                 
                </tr>
              }
            </tbody>
          </nz-table>
    </div>


</div>
