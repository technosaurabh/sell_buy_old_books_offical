<!-- book-card.component.html -->

<div class=" mt-3" style=" ">

    <div>
        <div class="mt-2 d-flex justify-content-between">
            <div>
                <h4 class="m-0 p-0">My Books</h4>
            </div>
            <div>
            <button [routerLink]="['/management/add-book']" class="btn btn-warning "><span class="fs-6">Add New Book</span></button>
            </div>
          </div>
    </div>
   
    <div class="mt-3" style=" display: flex; flex-wrap: wrap; column-gap: 0.5rem;">

        <div *ngFor="let book of bookFeed" style="" class="book-card mt-2">
            <div class="book-image">
              <img [src]="baseUrl + book.photoURL"  alt="Book Image">
              <span class="status "  [ngClass]="book.status === 'active' ? 'active' : 'sold'">{{book.status}}</span>
              <div (click)="showModal(book)" class="edit-background">
                <span class="edit-icon"><i class="bi bi-pencil-fill"></i></span>
              </div>
             
            </div>
          
            <div class="book-details">
              <h2 class="title">{{book.title}}</h2>
              <p class="description">{{book.description}}</p>
          
              <div class="meta">
                <p><strong>Condition:</strong> {{book.condition}}</p>
                <p><strong>Edition:</strong> {{book.edition}}</p>
                <p><strong>Category:</strong> {{book.category}}</p>
                <p><strong>Buy Date:</strong> {{book.buyDate | date : 'dd-MMMM-yyyy'}}</p>
              </div>
          
              <div class="footer">
                <div class="price">₹{{book.price}}</div>
                <div class="rating">⭐ {{book.startRating}}</div>
              </div>
        
              <div style=" column-gap: 5%;" class="mt-2 d-flex">
                <div style="width: 48%;">
                <button [routerLink]="['/management/edit-book/' + book._id]" class="btn btn-warning w-100">Edit</button>
                </div>
                <div style="width: 48%;">
                  <button (click)="showDeleteConfirm(book)" class="btn btn-danger w-100">Delete</button>
                </div>
            
              </div>
            </div>
          </div>

    </div>


</div>
  


 <!-- photo edit modal -->

<nz-modal [(nzVisible)]="isVisible" nzCancelDisabled="true" nzOkText="Upload" nzWidth="200px" nzTitle="Update Image" (nzOnCancel)="handleCancel()" (nzOnOk)="handleOk()">
  <ng-container *nzModalContent>
    <div class="row mt-3">

      <div class="col">
              <nz-upload class="col"
              nzListType="picture-card"
              [(nzFileList)]="fileList"
              [nzBeforeUpload]="beforeUpload"
              [nzShowButton]="fileList.length < 1"
              [nzPreview]="handlePreview"
              (nzChange)="handleFileChange($event)"
            >
              <div >
                <nz-icon nzType="plus" />
                <div style="margin-top: 8px">Upload</div>
              </div>
            </nz-upload>
      </div>
  </div>
  </ng-container>
</nz-modal>
